# E3 — stragglers (tests H3). README §5.
# Format: see the header of e1_scaling.yaml.
#
# sync, backup(b=1), backup(b=2) and hogwild at m = 8 under mild and heavy
# worker-time tails.
#   1 task x 4 mode variants x 2 tails x 3 seeds = 24
#
# T2 only since Nov 26, when T3a was dropped (see the header of
# e1_scaling.yaml), so E3 has no non-convex task. T3b is not a drop-in
# replacement: the injected delay is c + Exp with c = 200 us
# (hogwild/instrument.py), four times a T2 gradient step (about 50 us), and
# a T3b step takes about 2.5 ms, so the same delay would add 10% (mild) to
# 40% (heavy) to its step time instead of dominating it.
#
# Note for the write-up: backup uses m + b = 9 or 10 processes against 8 for
# sync and hogwild.
#
# Step size: sync and backup use eta_mult = m = 8, as in E1 (see the header of
# e1_scaling.yaml), so the no-straggler point of each curve is the E1 run.

name: e3_stragglers
seeds: [0, 1, 2]
expected_runs: 24

grids:
  - base: &e3_tasks
      - configs/t2_mnist_softmax.yaml
    mode: [hogwild]
    m: [8]
    straggler: [mild, heavy]

  - base: *e3_tasks
    mode: [sync]
    m: [8]
    eta_mult: [8]
    straggler: [mild, heavy]

  - base: *e3_tasks
    mode: [backup]
    b: [1, 2]
    m: [8]
    eta_mult: [8]
    straggler: [mild, heavy]
