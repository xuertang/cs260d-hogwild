# E1 — scaling (tests H1, H2). README §5.
#
# Sweep format (hogwild/sweep.py is the only reader):
#
#   name            label for logs
#   seeds           crossed with every grid block
#   expected_runs   sweep.expand() asserts it produces exactly this many Configs
#   grids           list of blocks; each block is a cartesian product of its
#                   list-valued fields. `base` names per-task config files
#                   (configs/t*.yaml), every other
#                   key is a Config field override.
#   eta_mult        not a Config field: multiplies the base config's eta.
#
# E1: serial reference, then sync / backup(b=1) / hogwild at m in {2,4,8,16}.
#   serial:      4 tasks x 3 seeds                    =  12
#   multi-worker: 4 tasks x 3 modes x 4 m x 3 seeds   = 144
#
# Step size. serial and hogwild use the serial-tuned eta. sync and backup use
# eta_mult = m (linear scaling): a round averages m gradients into ONE update,
# so at the serial eta these modes make m times fewer updates of the same size
# per epoch and cannot reach the target inside the epoch budget for m >= 4
# (the first full sweep, Nov 25: 0/3 seeds on every task). With eta_mult = m
# a round moves as far as the m serial steps it replaces. That is why sync and
# backup have one block per m below.
#
# Cut if time runs short (after E4): the m = 2 column.

name: e1_scaling
seeds: [0, 1, 2]
expected_runs: 156

grids:
  - base: &all_tasks
      - configs/t1_rcv1_logreg.yaml
      - configs/t2_mnist_softmax.yaml
      - configs/t3a_mnist_mlp.yaml
      - configs/t3b_cifar_cnn.yaml
    mode: [serial]
    m: [1]

  - base: *all_tasks
    mode: [hogwild]
    m: [2, 4, 8, 16]

  # sync: eta_mult = m.
  - {base: *all_tasks, mode: [sync], m: [2],  eta_mult: [2]}
  - {base: *all_tasks, mode: [sync], m: [4],  eta_mult: [4]}
  - {base: *all_tasks, mode: [sync], m: [8],  eta_mult: [8]}
  - {base: *all_tasks, mode: [sync], m: [16], eta_mult: [16]}

  # backup (b = 1): eta_mult = m, the quorum size — the b extra gradients are dropped.
  - {base: *all_tasks, mode: [backup], b: [1], m: [2],  eta_mult: [2]}
  - {base: *all_tasks, mode: [backup], b: [1], m: [4],  eta_mult: [4]}
  - {base: *all_tasks, mode: [backup], b: [1], m: [8],  eta_mult: [8]}
  - {base: *all_tasks, mode: [backup], b: [1], m: [16], eta_mult: [16]}   # 17 processes — check the core map
