# T3b — CIFAR-10, 4-conv CNN, 0.25M params, dense and non-convex.
#
# Base config: the serial reference run. Sweeps and CLI flags override
# mode / m / b / seed / tau_inject / straggler on top of this file.
#
# eta is left null on purpose: it resolves to the task's tuned default_eta in
# configs/reference.yaml (written by `python -m hogwild.tune --task t3b ...`).
#
# max_epochs is 12, NOT the 1.5x-reference (30 epochs) the other tasks use.
# This model overfits: serial test loss bottoms out at epoch 7 (the target is
# that minimum plus 10% slack, see tasks.CifarCNN) and rises from there, so epochs 13-30 would only measure
# overfitting while tripling the cost of the most expensive task. 12 epochs is
# 1.7x the epoch of the minimum. final_test_acc is therefore "accuracy after
# 12 epochs". To follow the README literally, set this back to 30.

task: t3b
mode: serial
m: 1
eta: null
seed: 0
batch_size: 8
max_epochs: 12
